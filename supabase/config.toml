# Configuración Supabase CLI — el project ref se guarda al hacer `supabase link`

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.hello-world]
enabled = true
verify_jwt = false
import_map = "./functions/hello-world/deno.json"
entrypoint = "./functions/hello-world/index.ts"

[functions.admin-login]
verify_jwt = false

[functions.admin-me]
verify_jwt = false

[functions.admin-dashboard]
verify_jwt = false

[functions.admin-settings]
verify_jwt = false

[functions.admin-google-auth]
verify_jwt = false

[functions.admin-google-disconnect]
verify_jwt = false

[functions.admin-google-callback]
verify_jwt = false

[functions.booking-config]
verify_jwt = false

[functions.availability]
verify_jwt = false

[functions.create-booking]
verify_jwt = false
